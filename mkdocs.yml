site_name: AKTV8 Fusion Library — Bibliothek
site_description: Read-only mirror of the AKTV8 Fusion design library for browsing
site_url: https://aktv8-tganss.github.io/Bibliothek/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Designs:
    - 00 - Parts:
      - Arduino:
        - Amplifier Board: designs/00-parts/arduino/amplifier-board.md
    - A-0010 iAir6:
      - CEPHALOPOD 2: designs/a-0010-iair6/cephalopod-2.md
      - FAST26 Clamping Jaws: designs/a-0010-iair6/fast26-clamping-jaws.md
      - A8 Parts:
        - 003234 X1a Manifold iAIR6: designs/a-0010-iair6/a8-parts/003234-x1a-manifold-iair6.md
        - 003270 FAST26: designs/a-0010-iair6/a8-parts/003270-fast26.md
      - DUT Box Parts:
        - CEPHALOPOD 3: designs/a-0010-iair6/dut-box-parts/cephalopod-3.md
        - Cylinder Block: designs/a-0010-iair6/dut-box-parts/cylinder-block.md
        - Cylinder Strap: designs/a-0010-iair6/dut-box-parts/cylinder-strap.md
        - Lid Hinge: designs/a-0010-iair6/dut-box-parts/lid-hinge.md
        - Plunger Stop: designs/a-0010-iair6/dut-box-parts/plunger-stop.md
        - Plunger Stop Solid: designs/a-0010-iair6/dut-box-parts/plunger-stop-solid.md
        - Plunger passthru: designs/a-0010-iair6/dut-box-parts/plunger-passthru.md
        - Poly Shield: designs/a-0010-iair6/dut-box-parts/poly-shield.md
        - Push Plate MFT: designs/a-0010-iair6/dut-box-parts/push-plate-mft.md
        - Push Plate VMT: designs/a-0010-iair6/dut-box-parts/push-plate-vmt.md
        - Rail: designs/a-0010-iair6/dut-box-parts/rail.md
        - Receive Block: designs/a-0010-iair6/dut-box-parts/receive-block.md
        - Reg Sleeve Mount: designs/a-0010-iair6/dut-box-parts/reg-sleeve-mount.md
        - Routed base: designs/a-0010-iair6/dut-box-parts/routed-base.md
        - VMT Adapt Plate: designs/a-0010-iair6/dut-box-parts/vmt-adapt-plate.md
        - VMT Probe Carrier: designs/a-0010-iair6/dut-box-parts/vmt-probe-carrier.md
        - Valve mount: designs/a-0010-iair6/dut-box-parts/valve-mount.md
      - OTS Parts:
        - Prox Switch: designs/a-0010-iair6/ots-parts/prox-switch.md
        - SS Relay Board: designs/a-0010-iair6/ots-parts/ss-relay-board.md
        - KQ2H03-33AS: designs/a-0010-iair6/ots-parts/kq2h03-33as.md
    - A-0054 iAir3 Gen2:
      - "22": designs/a-0054-iair3-gen2/design-22.md
      - GEN2 PROC MODULE: designs/a-0054-iair3-gen2/gen2-proc-module.md
      - GEN2 PROC MODULE 2026: designs/a-0054-iair3-gen2/gen2-proc-module-2026.md
      - Weight Plate: designs/a-0054-iair3-gen2/weight-plate.md
      - Flash Runner:
        - iAIR3 Gen2 Flash Runner Bed: designs/a-0054-iair3-gen2/flash-runner/iair3-gen2-flash-runner-bed.md
  - Indexes:
    - Shortlink Index: indexes/shortlinks.md
    - BOM / Uses Index: indexes/bom-uses.md
